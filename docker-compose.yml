# The Lazy server with its Postgres, for any machine with Docker:
#   cp .env.example .env     (then fill in the secrets)
#   docker compose up -d --build
# Coolify uses deploy/coolify/docker-compose.yaml instead. See llm-docs/DEPLOY.md.
name: lazy

services:
  postgres:
    # 18 and later keep the cluster in a versioned folder, so the volume is the parent directory.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: lazy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lazy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazy -d lazy"]
      interval: 5s
      timeout: 5s
      retries: 20

  lazy:
    build:
      context: .
    image: ${LAZY_IMAGE:-lazy-server:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lazy:${POSTGRES_PASSWORD}@postgres:5432/lazy
      LAZY_PUBLIC_URL: ${LAZY_PUBLIC_URL:-http://localhost:8080}
      # Seals integration credentials (openssl rand -hex 32); optional until an integration needs it.
      LAZY_CREDENTIALS_KEY: ${LAZY_CREDENTIALS_KEY:-}
      LAZY_CREDENTIALS_OLD_KEYS: ${LAZY_CREDENTIALS_OLD_KEYS:-}
      # Drop-ins (the rtc service below): empty turns them off.
      LAZY_RTC_URL: ${LAZY_RTC_URL:-}
      LAZY_RTC_SECRET: ${LAZY_RTC_SECRET:-}
      LAZY_SETUP_CODE: ${LAZY_SETUP_CODE:?set LAZY_SETUP_CODE in .env (20 to 64 letters and digits, and openssl rand -hex 24 makes one)}
      LAZY_SEED_REGISTRATION: ${LAZY_SEED_REGISTRATION:-invite_only}
      LAZY_OPEN_WORKSPACE_CREATION: ${LAZY_OPEN_WORKSPACE_CREATION:-true}
      LAZY_EVENT_RETENTION_DAYS: ${LAZY_EVENT_RETENTION_DAYS:-30}
      LAZY_MAX_ATTACHMENT_BYTES: ${LAZY_MAX_ATTACHMENT_BYTES:-26214400}
      LAZY_LOG: ${LAZY_LOG:-info,sqlx=warn}
      LAZY_LOG_FORMAT: ${LAZY_LOG_FORMAT:-text}
    volumes:
      - attachments:/data/attachments
    ports:
      - "${LAZY_PORT:-8080}:8080"

  # The call server for drop-ins, started only with `docker compose --profile drop-ins up -d`. Set
  # LAZY_RTC_SECRET and RTC_PUBLIC_IP in .env, and LAZY_RTC_URL to where clients reach port 7880
  # (wss:// behind your HTTPS proxy, or ws://host:7880 on a private network).
  rtc:
    profiles: ["drop-ins"]
    build:
      context: ./media
    image: ${RTC_IMAGE:-rtc-sfu:local}
    restart: unless-stopped
    environment:
      RTC_SECRET: ${LAZY_RTC_SECRET:-}
      RTC_PUBLIC_IP: ${RTC_PUBLIC_IP:-}
      RTC_UDP: 0.0.0.0:${RTC_UDP_PORT:-7881}
      # Who is in each drop-in, told to Lazy over the compose network (D44).
      RTC_REPORT_URL: ${RTC_REPORT_URL:-http://lazy:8080/v1/rtc/report}
    ports:
      - "${RTC_HTTP_PORT:-7880}:7880"
      - "${RTC_UDP_PORT:-7881}:${RTC_UDP_PORT:-7881}/udp"

volumes:
  pgdata:
  attachments:
