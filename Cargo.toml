[workspace]
resolver = "3"
members = ["crates/*"]
# The media library is its own workspace (llm-docs/DROP_INS.md); Lazy uses it by path.
exclude = ["media"]

[workspace.package]
version = "0.12.1"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates.
lazy-domain = { path = "crates/lazy-domain" }
lazy-protocol = { path = "crates/lazy-protocol" }
lazy-client-core = { path = "crates/lazy-client-core" }
lazy-client-runtime = { path = "crates/lazy-client-runtime" }
lazy-ui = { path = "crates/lazy-ui" }

# The media library (D39), by path until it has its own repository.
rtc-proto = { path = "media/crates/rtc-proto" }
rtc-video = { path = "media/crates/rtc-video", default-features = false }
rtc-audio = { path = "media/crates/rtc-audio", default-features = false }
rtc-client = { path = "media/crates/rtc-client", default-features = false }
rtc-sfu = { path = "media/crates/rtc-sfu" }

# GPUI is pinned to one full Zed revision; `gpui` and `gpui_platform` must stay on the same one.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e5bdd01cd819d6348ae764e69218adfee3d7edab" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e5bdd01cd819d6348ae764e69218adfee3d7edab", features = ["wayland", "x11", "font-kit"] }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "e5bdd01cd819d6348ae764e69218adfee3d7edab" }

# Shared.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
thiserror = "2"
tracing = "0.1"
proptest = "1"
unicode-segmentation = "1"
jiff = "0.2"
emojis = "0.9.1"

# Server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
sha2 = "0.11"
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }

# Client runtime.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
chacha20poly1305 = "0.11"
keyring = "4"
directories = "6"

# Client runtime.
async-channel = "2"
tempfile = "3"

# What the release workflow ships: the release profile, stripped. (Debug symbols are not needed for
# bug reports: the log and Diagnostics carry what a report needs, and the binary is half the size.)
# The codecs are C (OpenH264) and C transpiled to Rust (Opus): unoptimized, they cannot keep up
# with a call, so they are optimized even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.unsafe-libopus]
opt-level = 3

[profile.dist]
inherits = "release"
strip = true

# What the run scripts build: release-grade dependencies (GPUI, the codecs) compiled once, and the
# workspace crates incremental and lightly optimized so an edit rebuilds in seconds, not a minute.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 1
[profile.fast.package."*"]
opt-level = 3
