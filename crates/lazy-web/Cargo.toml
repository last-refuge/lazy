[package]
name = "lazy-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lazy's web client: the shared client core in the browser (D47)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lazy-client-core.workspace = true
lazy-domain.workspace = true
lazy-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
futures-channel = "0.3"
futures-util.workspace = true
time.workspace = true
# The CLI that turns the build into a module (`scripts/build-web.sh`) must be this exact version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "ClipboardEvent", "CloseEvent",
    "console", "DataTransfer", "Document", "DomRect", "DomTokenList", "Element", "Event",
    "EventTarget", "File", "FileList", "FocusEvent", "Headers", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "Location", "MessageEvent", "MouseEvent",
    "Node", "NodeList", "Request", "RequestCredentials", "RequestInit", "Response", "Storage",
    "Url", "WebSocket", "Window", "Notification", "NotificationOptions", "NotificationPermission",
    "VisibilityState", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition",
    "DragEvent", "CssStyleDeclaration", "AddEventListenerOptions", "HtmlCollection",
    "MediaQueryList", "Selection", "VisualViewport",
] }
console_error_panic_hook = "0.1"

# In the browser, randomness (ids) and the clock come from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
time = { workspace = true, features = ["wasm-bindgen"] }
