[package]
name = "lazy-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
lazy-client-core.workspace = true
lazy-domain.workspace = true
lazy-protocol.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true
jiff.workspace = true
# For the moments notification settings are made of; already part of the domain's types.
time.workspace = true
# The decoder gpui already links; the same version and formats, so nothing new is built.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Service logos in the Integrations dialog are SVGs, drawn once at start (already built by gpui).
resvg = { version = "0.46", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
proptest.workspace = true
serde_json.workspace = true
time.workspace = true
