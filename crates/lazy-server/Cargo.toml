[package]
name = "lazy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lazy_server"
path = "src/lib.rs"

[[bin]]
name = "lazy-server"
path = "src/main.rs"

[features]
# Test helpers (`lazy_server::testing`) for in-process end-to-end tests, including from other crates.
testing = ["dep:tempfile"]

[dependencies]
lazy-domain.workspace = true
lazy-protocol.workspace = true
argon2.workspace = true
# HMAC (GitHub's webhook signatures) and, later, RSA (GitHub App tokens); already built for reqwest's TLS.
aws-lc-rs = "1"
# Integration credentials are sealed with XChaCha20-Poly1305 (the client's files use it too).
chacha20poly1305.workspace = true
# Slack-style webhook bodies sent as a form (`payload=<json>`); already built for reqwest.
form_urlencoded = "1"
axum.workspace = true
bytes = "1"
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# Thumbnails and the dimensions of uploaded images: the four raster formats that are shown inline,
# and nothing else (no AVIF, TIFF, EXR, ..., and no rayon).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Talking to GitHub's API (rustls).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
# Constant-time comparison of webhook secret hashes (already in the lockfile through argon2).
subtle = "2"
thiserror.workspace = true
time.workspace = true
# `fs` and `io-util`: attachment files are written and read through tokio.
tokio = { workspace = true, features = ["fs", "io-util"] }
# `io`: a file's reader becomes a response body stream.
tokio-util = { workspace = true, features = ["io"] }
tempfile = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# `v5`: an Idempotency-Key becomes an operation id, a UUID v5 of (webhook id, key).
uuid = { workspace = true, features = ["v5"] }
# Credentials in memory are zeroed when dropped (already in the lockfile through chacha20poly1305).
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
# Integration tests use the in-process test server.
lazy-server = { path = ".", features = ["testing"] }
reqwest.workspace = true
tokio-tungstenite.workspace = true
