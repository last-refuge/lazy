# The media library (llm-docs/DROP_INS.md, D39): real-time audio and video in Rust, with its own
# server (an SFU), client, signaling, and join tokens. It knows nothing about Lazy, so it can be
# lifted into its own repository unchanged; Lazy depends on it by path.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rtc-proto = { path = "crates/rtc-proto" }
rtc-video = { path = "crates/rtc-video" }
rtc-audio = { path = "crates/rtc-audio" }
rtc-sfu = { path = "crates/rtc-sfu" }
rtc-client = { path = "crates/rtc-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
openh264 = "0.9"
unsafe-libopus = "0.2"
cpal = "0.18"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

# The codecs are C (OpenH264) and C transpiled to Rust (Opus): unoptimized, they cannot keep up
# with real time, so they are optimized even in debug builds.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.unsafe-libopus]
opt-level = 3
