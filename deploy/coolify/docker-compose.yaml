# Lazy on Coolify: New Resource, Public/Private Repository, Build Pack "Docker Compose", base
# directory "/", compose file "/deploy/coolify/docker-compose.yaml". Coolify fills in the domain, the
# TLS certificate, the database password, and the setup code (the SERVICE_* names below); open the
# resource's Environment Variables to read the setup code, and see llm-docs/DEPLOY.md for the rest.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: lazy
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: lazy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazy -d lazy"]
      interval: 5s
      timeout: 5s
      retries: 20

  lazy:
    build:
      # Coolify runs compose from the base directory ("/", the repository root), and relative paths
      # resolve from there, not from this file's folder.
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Gives the service a domain (editable in Coolify) routed to port 8080, with HTTPS and WebSockets.
      - SERVICE_URL_LAZY_8080
      - DATABASE_URL=postgres://lazy:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/lazy
      # The address clients, webhooks and GitHub use. Coolify's generated SERVICE_URL_LAZY is the
      # fallback; it can keep an old address after the domain changes, so set LAZY_PUBLIC_URL
      # (https://your.domain) in Coolify to be sure.
      - LAZY_PUBLIC_URL=${LAZY_PUBLIC_URL:-}
      - LAZY_DEFAULT_PUBLIC_URL=${SERVICE_URL_LAZY}
      - LAZY_SETUP_CODE=${SERVICE_PASSWORD_SETUPCODE}
      - LAZY_SEED_REGISTRATION=${LAZY_SEED_REGISTRATION:-invite_only}
      - LAZY_OPEN_WORKSPACE_CREATION=${LAZY_OPEN_WORKSPACE_CREATION:-true}
      - LAZY_EVENT_RETENTION_DAYS=${LAZY_EVENT_RETENTION_DAYS:-30}
      - LAZY_MAX_ATTACHMENT_BYTES=${LAZY_MAX_ATTACHMENT_BYTES:-26214400}
      - LAZY_LOG=${LAZY_LOG:-info,sqlx=warn}
      - LAZY_LOG_FORMAT=${LAZY_LOG_FORMAT:-text}
      # Seals integration credentials (64 hex digits: openssl rand -hex 32). Optional until an
      # integration needs it; keep a copy outside Coolify, because losing it loses every stored
      # credential (llm-docs/DEPLOY.md).
      - LAZY_CREDENTIALS_KEY=${LAZY_CREDENTIALS_KEY:-}
      - LAZY_CREDENTIALS_OLD_KEYS=${LAZY_CREDENTIALS_OLD_KEYS:-}
    volumes:
      - attachments:/data/attachments
    healthcheck:
      test: ["CMD", "lazy-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  attachments:
