name: ci

# Manual only, by choice: run it from the Actions tab (ci, Run workflow) or with
# `gh workflow run ci`. It checks formatting, lints, and builds; it runs no tests. The tests are
# their own workflow (tests.yml), run only when the owner asks for them.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libssl-dev libdbus-1-dev \
            pkg-config cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The media library is its own workspace (llm-docs/DROP_INS.md).
      - run: scripts/check-media-deps.sh
      - run: cargo fmt --all --check --manifest-path media/Cargo.toml
      - run: cargo clippy --workspace --all-targets --manifest-path media/Cargo.toml

  shared-core-mobile:
    # The shared crates must stay free of desktop-only dependencies (plan task 0.8).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target ${{ matrix.target }} -p lazy-domain -p lazy-protocol -p lazy-client-core
