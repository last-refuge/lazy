name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://lazy:lazy@localhost:5432/lazy

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lazy
          POSTGRES_PASSWORD: lazy
          POSTGRES_DB: lazy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libssl-dev libdbus-1-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  shared-core-mobile:
    # The shared crates must stay free of desktop-only dependencies (plan task 0.8).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target ${{ matrix.target }} -p lazy-domain -p lazy-protocol -p lazy-client-core
