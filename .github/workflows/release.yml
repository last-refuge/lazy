name: release

# Manual only, like ci: builds the desktop client for Linux, macOS, and Windows with their installers
# (the server image has its own workflow, server). Run it from the Actions tab (release, Run workflow) or with
#   gh workflow run release -f version=0.5.0 -f publish=true
# The files are not code-signed unless the macOS signing secrets below are set (see llm-docs/RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the apps and the file names, e.g. 0.5.0 or 0.5.1-rc.1"
        required: true
        type: string
      publish:
        description: "Create a draft GitHub release with the files (otherwise they are only workflow artifacts)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: The version must look like 1.2.3 or 1.2.3-name.4
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "not a valid version: $VERSION" >&2; exit 1; }

  linux:
    needs: check-version
    # The oldest runner still offered, so the binary runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libssl-dev libdbus-1-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Stamp the version
        shell: bash
        run: sed -i.bak -E "s/^version = \".*\"$/version = \"$VERSION\"/" Cargo.toml
      - name: Build
        run: cargo build --profile dist -p lazy-desktop
      - name: Package
        run: packaging/linux/build-linux.sh target/dist/lazy-desktop "$VERSION" out
      - name: Check the package installs and every library resolves
        run: |
          sudo apt-get install -y --no-install-recommends ./out/lazy-chat_*.deb
          ! ldd /usr/bin/lazy | grep "not found"
          dpkg -L lazy-chat
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  macos:
    needs: check-version
    # An Apple Silicon runner; it builds both architectures and joins them into one universal app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
          # So a failure after the build (the packaging) does not cost the build again.
          cache-on-failure: true
      - name: Stamp the version
        shell: bash
        run: sed -i.bak -E "s/^version = \".*\"$/version = \"$VERSION\"/" Cargo.toml
      # runtime-shaders compiles the Metal shaders when the app starts instead of needing the Metal
      # toolchain at build time.
      - name: Build both architectures
        run: |
          cargo build --profile dist -p lazy-desktop --features runtime-shaders --target aarch64-apple-darwin
          cargo build --profile dist -p lazy-desktop --features runtime-shaders --target x86_64-apple-darwin
      - name: Import the signing certificate (only if the secrets are set)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          fi
      - name: Package
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          df -h / "${TMPDIR:-/tmp}" || true
          packaging/macos/build-macos.sh \
            target/aarch64-apple-darwin/dist/lazy-desktop \
            target/x86_64-apple-darwin/dist/lazy-desktop \
            "$VERSION" out
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Stamp the version
        shell: bash
        run: sed -i.bak -E "s/^version = \".*\"$/version = \"$VERSION\"/" Cargo.toml
      - name: Build
        run: cargo build --profile dist -p lazy-desktop
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: packaging\windows\build-windows.ps1 -Binary target\dist\lazy-desktop.exe -Version $env:VERSION -OutDir out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    if: ${{ inputs.publish }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Lazy $VERSION" \
            --notes "Lazy $VERSION. Linux: the .deb or the tarball (run ./install.sh). macOS: open the .dmg, drag Lazy to Applications, and if macOS says it cannot verify Lazy, choose Open Anyway in System Settings, Privacy and Security (on macOS 14 or earlier, right-click it and choose Open); the app is not notarized unless signing secrets were set. Windows: run the Setup .exe (SmartScreen says unknown publisher: More info, Run anyway) or unpack the .zip. Choose your server on the sign-in screen. SHA256SUMS lists the checksums."
