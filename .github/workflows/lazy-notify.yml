# Posts this repository's pull requests, pushes to main, issues, and releases into a Lazy channel
# through an incoming webhook. A stopgap for testing until Lazy has a GitHub connector (Phase 4.5).
#
# Setup: in Lazy, Integrations, Add incoming webhook, copy the address; in GitHub, Settings, Secrets
# and variables, Actions, save it as LAZY_WEBHOOK_URL. Without the secret (or on a pull request from
# a fork, which gets no secrets) the job skips with a notice.
#
# This is a notification, not CI: it runs on events on purpose and costs a few seconds. The test
# suite stays manual (ci.yml).
name: Notify Lazy

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post to Lazy
        # Everything from the event reaches the script as environment variables, never as text
        # spliced into it, so a title cannot run as a command.
        env:
          LAZY_WEBHOOK_URL: ${{ secrets.LAZY_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_COUNT: ${{ github.event.commits && toJSON(github.event.commits) }}
          COMPARE_URL: ${{ github.event.compare }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$LAZY_WEBHOOK_URL" ]; then
            echo "::notice::LAZY_WEBHOOK_URL is not set (or this is a fork's pull request); nothing posted."
            exit 0
          fi
          case "$EVENT" in
            pull_request)
              verb="$ACTION"
              if [ "$ACTION" = closed ] && [ "$PR_MERGED" = true ]; then verb=merged; fi
              if [ "$ACTION" = opened ] && [ "$PR_DRAFT" = true ]; then verb="opened a draft of"; fi
              text="**$ACTOR** $verb PR [#$PR_NUMBER $PR_TITLE]($PR_URL) in $REPO" ;;
            push)
              commits=$(printf '%s' "$COMMIT_COUNT" | jq 'length' 2>/dev/null || echo 1)
              first_line=${COMMIT_MSG%%$'\n'*}
              if [ "$commits" -gt 1 ]; then
                text="**$ACTOR** pushed $commits commits to $REPO main, latest: $first_line ([changes]($COMPARE_URL))"
              else
                text="**$ACTOR** pushed to $REPO main: $first_line ([changes]($COMPARE_URL))"
              fi ;;
            issues)
              text="**$ACTOR** $ACTION issue [#$ISSUE_NUMBER $ISSUE_TITLE]($ISSUE_URL) in $REPO" ;;
            release)
              text="**$ACTOR** released [$RELEASE_NAME]($RELEASE_URL) in $REPO" ;;
            *)
              echo "::notice::No message for $EVENT"; exit 0 ;;
          esac
          # jq makes the JSON, so quotes and newlines in titles cannot break it. The key makes a
          # retry post once (Lazy logs the repeat as "Already posted").
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS --retry 3 --retry-all-errors --max-time 20 \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: $KEY" \
              --data-binary @- "$LAZY_WEBHOOK_URL" > /dev/null
          echo "Posted to Lazy."
